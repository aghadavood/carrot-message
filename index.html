<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eine Botschaft aus deinem Glas 🥕</title>

  <style>
    :root {
      --bg: #fff8ee;
      --card: #ffffff;
      --text: #2d2926;
      --muted: #756d65;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 28px;
      padding: 40px 26px;
      text-align: center;
      box-shadow: 0 14px 40px rgba(64, 45, 25, 0.09);
    }

    .jar {
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .emoji {
      font-size: 48px;
    }

    h1 {
      font-size: clamp(22px, 5vw, 32px);
      margin: 12px 0 28px;
    }

    #message {
      min-height: 150px;
      display: grid;
      place-items: center;
      font-size: clamp(24px, 6vw, 38px);
      line-height: 1.3;
      font-weight: 700;
      padding: 14px 4px;
    }

    .footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="jar" id="jar">
      Dein Glas
    </div>

    <div class="emoji">
      🥕
    </div>

    <h1>
      Eine kleine Botschaft aus deinem Glas
    </h1>

    <div id="message" aria-live="polite"></div>

    <div class="footer">
      Jedes Glas erzählt.<br>
      Kleiner Test. Große Neugier.
    </div>

  </main>

<script>

const messages = {
  "01": "Du machst das besser, als du denkst.",
  "02": "Heute darf leicht sein.",
  "03": "Vielleicht war genau dieses Glas für dich bestimmt.",
  "04": "Ein kleines Glas. Ein ziemlich guter Moment.",
  "05": "Du musst heute nicht alles schaffen.",
  "06": "Mehr Karotte. Weniger Drama.",
  "07": "Das Leben ist zu kurz für langweiliges Frühstück.",
  "08": "Falls es dir heute noch niemand gesagt hat: Schön, dass du da bist.",
  "09": "Manchmal beginnt etwas Gutes mit einem Löffel.",
  "10": "Bleib neugierig.",
  "11": "Du bist näher dran, als du glaubst.",
  "12": "Heute ist ein guter Tag für etwas Unerwartetes.",
  "13": "Mach mehr von dem, was dich lächeln lässt.",
  "14": "Vielleicht brauchst du keinen perfekten Plan. Nur den nächsten Schritt.",
  "15": "Sei freundlich zu dir. Auch Karotten brauchen Zeit.",
  "16": "Du hast gerade Marmelade gescannt. So schlecht kann dein Tag nicht sein.",
  "17": "Plot Twist: Heute wird besser als gedacht.",
  "18": "Nicht alles muss Sinn machen. Diese Karotte zum Beispiel.",
  "19": "Falls du auf ein Zeichen gewartet hast: 🥕",
  "20": "Deine heutige Aufgabe: mindestens einmal grundlos lächeln.",
  "21": "Du darfst stolz auf kleine Schritte sein.",
  "22": "Vielleicht ist heute nicht perfekt. Aber vielleicht ziemlich gut.",
  "23": "Ein bisschen Mut passt in jeden Tag.",
  "24": "Mach langsam. Gute Dinge müssen nicht hetzen.",
  "25": "Du bist nicht zu spät. Du bist unterwegs.",
  "26": "Heute zählt auch ein kleines Ja.",
  "27": "Ein Löffel Glück ist immer noch Glück.",
  "28": "Manchmal ist Pause auch Fortschritt.",
  "29": "Du musst nicht alles wissen, um anzufangen.",
  "30": "Wenn nichts hilft: Brot. Marmelade. Nochmal versuchen.",
  "31": "Dein zukünftiges Ich wird dir für einen kleinen mutigen Schritt danken.",
  "32": "Du darfst deine Meinung ändern. Sogar über Karotten.",
  "33": "Ein guter Tag muss nicht spektakulär sein.",
  "34": "Vielleicht wartet heute irgendwo ein schöner Zufall auf dich.",
  "35": "Du bist mehr als deine To-do-Liste.",
  "36": "Die Welt braucht nicht deine Perfektion. Nur ein bisschen mehr von dir.",
  "37": "Atme ein. Atme aus. Nimm noch einen Löffel.",
  "38": "Du darfst Dinge nur machen, weil sie dir Freude machen.",
  "39": "Große Geschichten fangen oft ziemlich klein an.",
  "40": "Wenn du heute nur eine Sache schaffst: Sei nett zu dir.",
  "41": "Das hier ist deine offizielle Erlaubnis für einen kleinen Genussmoment.",
  "42": "Du musst nicht produktiv sein, um einen guten Tag zu haben.",
  "43": "Vielleicht ist dein nächster guter Gedanke nur einen Löffel entfernt.",
  "44": "Heute bitte keine unnötige Selbstkritik. Die Karotte hat es verboten.",
  "45": "Du bist gerade Teil einer sehr kleinen Karotten-Geschichte.",
  "46": "Wenn du das lesen kannst, hast du schon etwas Neues ausprobiert.",
  "47": "Mut sieht manchmal aus wie: einfach mal probieren.",
  "48": "Es darf gleichzeitig chaotisch und schön sein.",
  "49": "Dieser Moment gehört dir. Mach was Gutes draus.",
  "50": "Danke, dass dieses Glas bei dir gelandet ist."
};


const params = new URLSearchParams(window.location.search);
let glas = params.get("glas");

if (glas) {

  glas = glas.replace(/\D/g, "");

  if (glas.length === 1) {
    glas = "0" + glas;
  }

  if (messages[glas]) {

    document.getElementById("jar").textContent =
      "Glas #" + glas;

    document.getElementById("message").textContent =
      messages[glas];

  } else {

    document.getElementById("jar").textContent =
      "Dein Glas";

    document.getElementById("message").textContent =
      "Dieses Glas hat seine Geschichte verloren. 🥕";

  }

} else {

  document.getElementById("jar").textContent =
    "Dein Glas";

  document.getElementById("message").textContent =
    "Dieses Glas wartet noch auf seine Nummer. 🥕";

}

</script>


</body>
</html>
